<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; padding: 10px; width: 250px; background-color: #f9f9f9; }
    h2 { font-size: 16px; margin: 0 0 10px 0; color: #4CAF50; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
    .stat { margin: 5px 0; font-size: 14px; display: flex; justify-content: space-between; }
    .stat label { font-weight: bold; color: #555; }
    .stat span { color: #000; }
  </style>
</head>
<body>
  <h2>Statystyki zaznaczenia</h2>
  <div class="stat"><label>Znaki:</label> <span id="charCount">0</span></div>
  <div class="stat"><label>Słowa:</label> <span id="wordCount">0</span></div>
  <div class="stat"><label>Linie:</label> <span id="lineCount">0</span></div>
  <script src="popup.js"></script>
</body>
</html>
